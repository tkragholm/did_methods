[package]
name = "did_methods"
version = "0.1.0"
edition = "2024"
authors = ["Tobias Kragholm"]
license = "MIT OR Apache-2.0"
description = "Reusable difference-in-differences primitives for event-study style analyses"
autotests = false

[features]
default = []
# HonestDiD sensitivity analysis (Rambachan-Roth). Optional because it is the
# only consumer of the `clarabel` and `highs` LP/QP solvers: `highs-sys` builds
# HiGHS from C++, which is the main portability risk when cross-compiling to
# x86_64-pc-windows-msvc. Consumers that only need ATT(g,t), DRDID and the
# aggregations link neither solver.
honest = ["dep:clarabel", "dep:highs", "dep:highs-sys"]
# The parity suite covers the honest surface as well, so it implies the feature.
parity-tests = ["honest"]
hotpath = ["dep:hotpath", "hotpath/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]

[dependencies]
bon = "3"
argmin = { git = "https://github.com/cloudsftp/argmin", branch = "update-faer-v24" }
argmin-math = { git = "https://github.com/cloudsftp/argmin", package = "argmin-math", branch = "update-faer-v24", default-features = false, features = ["vec", "faer_v0_24"] }
clarabel = { version = "0.11.1", optional = true }
dyn-stack = "0.13.2"
faer = { version = "0.24.0", features = ["nightly", "perf-warn"] }
highs = { version = "2.0.0", optional = true }
highs-sys = { version = "1.14.2", optional = true }
itertools = "0.14"
rand = "0.10.0"
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
statrs = "0.18.0"
thiserror = "2.0.18"
tracing = "0.1.41"
hotpath = { version = "0.15.0", optional = true }
once_map = "0.4.23"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }
rand_distr = "0.6.0"
rstest = "0.26"
proptest = "1.6.0"

[[bench]]
name = "core_workflows"
harness = false
required-features = ["honest"]

# These two exercise the HonestDiD surface, so they only build with it enabled.
# `att_gt_basic` stays feature-free: it is the example a consumer of the default
# build should be able to run.
[[example]]
name = "honest_workflow"
required-features = ["honest"]

[[example]]
name = "api_evolution_demo"
required-features = ["honest"]

[[test]]
name = "dataset_validation"
path = "tests/dataset_validation.rs"

[[test]]
name = "parity"
path = "tests/parity.rs"
required-features = ["parity-tests"]

[[test]]
name = "parity_cs_panel"
path = "tests/parity_cs_panel.rs"
required-features = ["parity-tests"]

[[test]]
name = "parity_drdid_rc_efficient"
path = "tests/parity_drdid_rc_efficient.rs"
required-features = ["parity-tests"]
