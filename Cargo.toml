[package]
name = "did_methods"
version = "0.1.0"
edition = "2024"
authors = ["Tobias Kragholm"]
license = "MIT OR Apache-2.0"
description = "Reusable difference-in-differences primitives for event-study style analyses"
rust-version = "1.88"
repository = "https://github.com/tkragholm/did_methods"
readme = "README.md"
keywords = ["did", "causal-inference", "econometrics", "event-study", "statistics"]
categories = ["science", "mathematics"]
include = ["src/**/*.rs", "examples/**/*.rs", "README.md", "LICENSE-MIT", "LICENSE-APACHE", "Cargo.toml"]
autotests = false

[features]
default = []
# HonestDiD sensitivity analysis (Rambachan-Roth). Optional because it is the
# only consumer of the `clarabel` conic solver; the linear programs of the
# conditional test run on the crate's own dense simplex. Consumers that only
# need ATT(g,t), DRDID and the aggregations link no solver.
honest = ["dep:clarabel"]
# The parity suite covers the honest surface as well, so it implies the feature.
parity-tests = ["honest"]
hotpath = ["dep:hotpath", "hotpath/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]

[dependencies]
bon = "3"
clarabel = { version = "0.11.1", optional = true }
epistat-inference = "0.3.0"
epistat-linalg = "0.3.0"
epistat-optim = "0.1.0"
epistat-rng = { version = "0.1.2", features = ["rand"] }
epistat-stats = "0.2.0"
dyn-stack = "0.13.2"
faer = { version = "0.24.0", features = ["nightly", "perf-warn"] }
itertools = "0.14"
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.18"
tracing = "0.1.41"
hotpath = { version = "0.15.0", optional = true }
once_map = "0.4.23"

[dev-dependencies]
epistat-testkit = { git = "https://github.com/tkragholm/epistat", rev = "3ef48dd7ed88588ea4c64ca560f5c7d08de89b57" }
criterion = { version = "0.8.2", default-features = false }
rand = "0.10.0"
rand_distr = "0.6.0"
rstest = "0.26"
proptest = "1.6.0"

[[bench]]
name = "core_workflows"
harness = false
required-features = ["honest"]

# These two exercise the HonestDiD surface, so they only build with it enabled.
# `att_gt_basic` stays feature-free: it is the example a consumer of the default
# build should be able to run.
[[example]]
name = "honest_workflow"
required-features = ["honest"]

[[example]]
name = "api_evolution_demo"
required-features = ["honest"]

[[example]]
name = "surface_profile"
required-features = ["honest"]

[[test]]
name = "dataset_validation"
path = "tests/dataset_validation.rs"

[[test]]
name = "solver_counts"
path = "tests/solver_counts.rs"
required-features = ["honest"]

[[test]]
name = "parity"
path = "tests/parity.rs"
required-features = ["parity-tests"]

[[test]]
name = "parity_cs_panel"
path = "tests/parity_cs_panel.rs"
required-features = ["parity-tests"]

[[test]]
name = "parity_drdid_rc_efficient"
path = "tests/parity_drdid_rc_efficient.rs"
required-features = ["parity-tests"]

[[test]]
name = "parity_drdid_improved"
path = "tests/parity_drdid_improved.rs"
required-features = ["parity-tests"]
